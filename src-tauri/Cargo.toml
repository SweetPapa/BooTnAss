[package]
name = "boot-n-ass"
version = "1.0.0"
description = "BOOT N ASS — Retro Synthwave 3D On-Rails Arcade Space Shooter"
authors = ["Sweet Papa Technologies"]
edition = "2021"

[lib]
name = "boot_n_ass_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
